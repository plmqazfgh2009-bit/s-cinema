
name: Build S CINEMA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'S-CINEMA-TMDB-UPDATED-SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Extract project
        run: |
          unzip -q S-CINEMA-TMDB-UPDATED-SOURCE.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: S-CINEMA-debug-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
