
name: Build S CINEMA APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source
        run: |
          unzip -q S-CINEMA-TMDB-UPDATED-SOURCE.zip -d source
          test -f source/CINEMA-X-Android/settings.gradle

      - name: Build APK
        run: |
          cd source/CINEMA-X-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-CINEMA-APK
          path: source/CINEMA-X-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
