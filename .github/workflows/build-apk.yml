
name: Build S CINEMA APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find and extract source
        run: |
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Upload the S CINEMA source ZIP to the repository first."
            exit 1
          fi

          echo "Found source archive: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ ! -f source/CINEMA-X-Android/settings.gradle ]; then
            echo "ERROR: Expected Android project was not found in ZIP."
            find source -name settings.gradle -print
            exit 1
          fi

      - name: Build APK
        run: |
          cd source/CINEMA-X-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-CINEMA-APK
          path: source/CINEMA-X-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
