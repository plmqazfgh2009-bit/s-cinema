
name: Build S CINEMA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android Gradle project
        id: gradle
        run: |
          FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No gradlew found. ZIP may not contain a buildable Android project."
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        working-directory: .
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-CINEMA-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
